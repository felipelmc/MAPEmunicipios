project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - dados/
    - img/

website:
  title: "MAPEmunicipios"
  description: >
    Dados dos 5.570 municípios brasileiros, de 1989 a 2024, em 17 eixos
    temáticos. Um pacote R do MAPE/IESP-UERJ.
  site-url: https://mape-iesp.github.io/MAPEmunicipios/
  repo-url: https://github.com/mape-iesp/MAPEmunicipios
  favicon: img/favicon.svg
  page-navigation: true

  navbar:
    background: light
    logo: img/marca.svg
    logo-alt: "MAPEmunicipios"
    left:
      - href: index.qmd
        text: Início
      - href: comecar.qmd
        text: Comece aqui
      - href: dados.qmd
        text: Os dados
      - href: exemplos.qmd
        text: Exemplos
      - href: referencia.qmd
        text: Referência
    right:
      - icon: github
        href: https://github.com/mape-iesp/MAPEmunicipios
        aria-label: GitHub

  page-footer:
    background: light
    left: |
      **MAPEmunicipios** — [MAPE/IESP-UERJ](https://mape-iesp.github.io)
    center: |
      Dados sob [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.pt-br) ·
      Código sob [MIT](https://github.com/mape-iesp/MAPEmunicipios/blob/main/LICENSE.md)
    right: |
      [ETL](https://github.com/mape-iesp/MAPEmunicipios-ETL) ·
      [GitHub](https://github.com/mape-iesp/MAPEmunicipios)

format:
  html:
    theme: [cosmo, styles.scss]
    css: styles.css
    toc: true
    toc-title: "Nesta página"
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    code-copy: hover
    code-overflow: wrap
    highlight-style: github
    fig-responsive: true
    lang: pt-BR
    grid:
      sidebar-width: 250px
      body-width: 940px
      margin-width: 240px

execute:
  freeze: auto
  warning: false
  message: false

lang: pt
